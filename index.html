async function sb(path,opts={}){
  const headers={
    "apikey":SB_KEY,
    "Content-Type":"application/json",
    ...(opts.headers||{})
  };

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);

  try{
    const r=await fetch(
      SB_URL+"/rest/v1/"+path,
      {
        ...opts,
        headers,
        signal:controller.signal
      }
    );

    const t=await r.text();

    if(!r.ok){
      throw new Error(t||"HTTP "+r.status);
    }

    return t?JSON.parse(t):[];

  }catch(e){
    if(e.name==="AbortError"){
      throw new Error("Supabase ba\u011flant\u0131s\u0131 8 saniyede yan\u0131t vermedi");
    }
    throw e;
  }finally{
    clearTimeout(timer);
  }
}


function money(n){

return Number(n||0).toLocaleString(
"tr-TR",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
)+" TL";

}


function toast(s){

const e=document.getElementById("toast");

e.textContent=s;
e.style.display="block";

}


function go(id){

}


function options(){

      " \u2014 " +
      p.name +
      (p.sale_price != null ? " \u2014 " + money(p.sale_price) : "") +
      "</option>";
  }).join("");
}


function customerOptions(){

return state.customers.map(
c=>

"</option>"

function renderDashboard(){

  let debt=0;

  state.customers.forEach(c=>{
    debt+=Number(c.balance||0);
  });

  const today=new Date().toISOString().slice(0,10);

  const sales=state.sales
    .filter(s=>
      s.sale_date?.slice(0,10)===today
    )
    .reduce(
      (a,s)=>a+Number(s.total||0),
      0
    );

  const low=state.products.filter(
    p=>
      state.stock
        .filter(x=>
          String(x.product_id)===String(p.id)
        )
        .reduce(
          (a,x)=>a+Number(x.quantity||0),
          0
        )<2
  ).length;

  statDebt.textContent=money(debt);
  statSales.textContent=money(sales);
  statProducts.textContent=state.products.length;
  statLow.textContent=low;

  recent.innerHTML=state.sales
    .slice(0,6)
    .map(s=>`
      <div class="movement">
        <div>
          <b>M\u00fc\u015fteri #${s.customer_id}</b>
          <small>${new Date(s.sale_date).toLocaleString("tr-TR")}</small>
        </div>
        <b>${money(s.total)}</b>
      </div>
    `)
    .join("")
    ||
    '<p class="muted">Hen\u00fcz sat\u0131\u015f yok.</p>';
}

async function upsertStock(product_id,location,delta){

  const rows=await sb(
    "stock?product_id=eq."+encodeURIComponent(product_id)+"&location=eq."+encodeURIComponent(location),
    {
      method:"GET"
    }
  );

  if(rows.length){

    const row=rows[0];

    const next=Number(row.quantity||0)+Number(delta);

    if(next<0){
      throw new Error("Yetersiz stok");
    }

    await sb(
      "stock?id=eq."+row.id,
      {
        method:"PATCH",
        body:JSON.stringify({
          quantity:next
        })
      }
    );

  }else{

    if(Number(delta)<0){
      throw new Error("Yetersiz stok");
    }

    await sb(
      "stock",
      {
        method:"POST",
        body:JSON.stringify({
          product_id:product_id,
          location:location,
          quantity:Number(delta)
        })
      }
    );

  }

}

async function renderDetail(){

  if(!detailId) return;

  let c = state.customers.find(
    x => String(x.id) === String(detailId)
  );

  if(!c) return;

  detailName.textContent = c.name;

  try{

    // Cari hareketleri al
    let ledger = await sb(
      `customer_ledger?select=*&customer_id=eq.${c.id}&order=movement_date.desc`
    );

    // Cari bakiye SADECE ledger \u00fczerinden hesaplan\u0131r
    let balance = ledger.reduce(
      (a,x) =>
        a +
        Number(x.debit || 0) -
        Number(x.credit || 0),
      0
    );

    detailBalance.textContent = money(balance);


    // M\u00fc\u015fterinin b\u00fct\u00fcn sat\u0131\u015flar\u0131n\u0131 al
    let sales = await sb(
      'sales?select=*&customer_id=eq.${c.id}&order=sale_date.desc'
    );


    let movements = [];


    // SATI\u015eLARI DETAYA EKLE
    for(const sale of sales){

      let items = await sb(
        `sale_items?select=*&sale_id=eq.${sale.id}`
      );

      let productText = items.map(item => {

        let product = state.products.find(
          p => String(p.id) === String(item.product_id)
        );

        return (
          (product?.name || "\u00dcr\u00fcn") +
          " x " +
          Number(item.quantity || 0).toLocaleString("tr-TR") +
          " " +
          (item.unit || "")
        );

      }).join(" \u2022 ");


      movements.push({

        date: sale.sale_date,

        html: `
          <div class="movement">

            <div>

              <b>
                ${sale.payment_type === "cash"
                  ? "Pe\u015fin Sat\u0131\u015f"
                  : "Cari Sat\u0131\u015f"} #${sale.id}
              </b>

              <small>
                ${productText}
              </small>

              <small>
                ${new Date(sale.sale_date)
                  .toLocaleString("tr-TR")}
              </small>

            </div>

            <b>
              ${money(sale.total)}
            </b>

          </div>
        `

      });

    }


    // TAHS\u0130LAT VE D\u0130\u011eER CAR\u0130 HAREKETLER\u0130 EKLE
    ledger.forEach(x => {

      // Sat\u0131\u015f kay\u0131tlar\u0131n\u0131 yukar\u0131dan zaten ekledik
      if(x.movement_type === "sale") return;

      movements.push({

        date: x.movement_date,

        html: `
          <div class="movement">

            <div>

              <b>
                ${x.description || x.movement_type}
              </b>

              <small>
                ${new Date(x.movement_date)
                  .toLocaleString("tr-TR")}
              </small>

            </div>

            <b class="${Number(x.debit) > 0 ? "plus" : "minus"}">

              ${Number(x.debit) > 0 ? "+" : "-"}
              ${money(Number(x.debit || x.credit))}

            </b>

          </div>
        `

      });

    }


    // Tarihe g\u00f6re s\u0131rala
    movements.sort(
      (a,b) =>
        new Date(b.date) - new Date(a.date)
    );


    detailMovements.innerHTML =
      movements.map(x => x.html).join("")
      ||
      '<p class="muted">Hareket yok.</p>';


  }catch(e){

    console.error(e);

    detailMovements.innerHTML =
      '<p class="muted">Cari hareketleri y\u00fcklenemedi.</p>';

  }

}

async function saveTransfer(){

  const i = Number(
    transferProduct.value
  );

  const q = Number(
    document.getElementById("transferQty").value
  );

  const direction =
    document.getElementById("transferDirection").value;

  if(!q || q <= 0){
    toast("Miktar girin");
    return;
  }

  try{

    const p = state.products[i];

    if(!p){
      toast("\u00dcr\u00fcn se\u00e7ilmedi");
      return;
    }

    if(direction === "toVehicle"){

      // DEPO \u2192 ARA\u00c7
      await upsertStock(
        p.id,
        "warehouse",
        -q
      );

      await upsertStock(
        p.id,
        "vehicle",
        q
      );

      await sb(
        "stock_movements",
        {
          method:"POST",
          body:JSON.stringify({
            product_id:p.id,
            movement_type:"transfer",
            from_location:"warehouse",
            to_location:"vehicle",
            quantity:q
          })
        }
      );

      toast("Ara\u00e7 sto\u011funa aktar\u0131ld\u0131");

    }else if(direction === "toWarehouse"){

      // ARA\u00c7 \u2192 DEPO
      await upsertStock(
        p.id,
        "vehicle",
        -q
      );

      await upsertStock(
        p.id,
        "warehouse",
        q
      );

      await sb(
        "stock_movements",
        {
          method:"POST",
          body:JSON.stringify({
            product_id:p.id,
            movement_type:"transfer",
            from_location:"vehicle",
            to_location:"warehouse",
            quantity:q
          })
        }
      );

      toast("Depo sto\u011funa aktar\u0131ld\u0131");

    }

    document.getElementById(
      "transferQty"
    ).value = "";

    await loadData();

  }catch(e){

    console.error(e);

    toast(
      e.message ||
      "Transfer yap\u0131lamad\u0131"
    );

  }
}

function renderProducts(){

  const q =
    (productSearch?.value || "")

  productList.innerHTML =
    state.products
    .filter(p => p.active !== false)
    .filter(p =>

    )
    .map(p => `

        </div>

        <div>

            ${p.sale_price == null
              ? "Fiyat girilmemi\u015f"
              : money(p.sale_price)}
          </b>

          <button
            class="small"
            onclick="editProductPrice(${p.id})">
            D\u00dcZENLE
          </button>
        </div>

      </div>
    `)
    .join("")
    ||
    '<p class="muted">\u00dcr\u00fcn bulunamad\u0131.</p>';
}
  async function editProductPrice(id){

  const p = state.products.find(
    x => String(x.id) === String(id)
  );

  if(!p) return;

  const action = prompt(
    "\u00dcR\u00dcN \u0130\u015eLEM\u0130\n\n" +
    "1 = \u00dcr\u00fcn\u00fc D\u00fczenle\n" +
    "2 = \u00dcr\u00fcn\u00fc Sil\n\n" +
    "Se\u00e7iminiz:"
  );

  if(action === null) return;

  if(action === "2"){

    const ok = confirm(
      p.name +
      " (" +
      (p.package_size || "") +
      ")\n\nBu \u00fcr\u00fcn\u00fc silmek istedi\u011finize emin misiniz?"
    );

    if(!ok) return;

    try{

      await sb(
        "products?id=eq." + id,
        {
          method:"PATCH",
          body:JSON.stringify({
            active:false
          })
        }
      );

      toast("\u00dcr\u00fcn silindi");

      await loadData();
      renderProducts();

    }catch(e){

      console.error(e);

      toast(
        e.message ||
        "\u00dcr\u00fcn silinemedi"
      );
    }

    return;
  }

  if(action !== "1"){
    toast("1 veya 2 girin");
    return;
  }

  const name = prompt(
    "\u00dcr\u00fcn ad\u0131:",
    p.name || ""
  );

  if(name === null) return;

  const packageSize = prompt(
    "Paket / gramaj:",
    p.package_size || ""
  );

  if(packageSize === null) return;

  const priceValue = prompt(
    "Sat\u0131\u015f fiyat\u0131:",
    p.sale_price ?? ""
  );

  if(priceValue === null) return;

  const price = Number(
    String(priceValue).replace(",", ".")
  );

  if(
    !name.trim() ||
    !packageSize.trim() ||
    !Number.isFinite(price) ||
    price < 0
  ){

    toast("Bilgileri kontrol edin");
    return;
  }

  try{

    await sb(
      "products?id=eq." + id,
      {
        method:"PATCH",
        body:JSON.stringify({
          name:name.trim(),
          package_size:packageSize.trim(),
          sale_price:price
        })
      }
    );

    toast("\u00dcr\u00fcn g\u00fcncellendi");

    await loadData();

  }catch(e){

    console.error(e);

    toast(
      e.message ||
      "\u00dcr\u00fcn g\u00fcncellenemedi"
    );
  }
}
